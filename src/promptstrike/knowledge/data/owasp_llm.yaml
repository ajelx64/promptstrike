# OWASP Top 10 for LLM Applications, 2025 edition.
# Source + license recorded in MANIFEST.yaml under key `owasp_llm`.
#
# Entry ids use OWASP's own citation form ("LLM01:2025"). The bare prefix (LLM01) is the value of
# promptstrike.taxonomy.OwaspLLM, which stays the stable internal enum; a test asserts the two
# remain in lockstep so a pack refresh cannot silently drift from the code.
#
# NOTE: the legacy list at owasp.org/www-project-top-10-for-large-language-model-applications is a
# superseded 2023 v1.1 with DIFFERENT meanings for the same ids (its LLM02 is "Insecure Output
# Handling"). Always refresh from genai.owasp.org.

entries:
  - id: LLM01:2025
    title: Prompt Injection
    description: >-
      User- or third-party-supplied input manipulates the LLM's instructions or behavior in
      unintended ways.

  - id: LLM02:2025
    title: Sensitive Information Disclosure
    description: >-
      The LLM inadvertently reveals confidential data, PII, or proprietary information in its
      outputs.

  - id: LLM03:2025
    title: Supply Chain
    description: >-
      Vulnerabilities in training data, models, plugins, or dependencies compromise the integrity of
      the LLM application.

  - id: LLM04:2025
    title: Data and Model Poisoning
    description: >-
      Training or fine-tuning data is tampered with to introduce vulnerabilities, backdoors, or
      biases into the model.

  - id: LLM05:2025
    title: Improper Output Handling
    description: >-
      Downstream systems process LLM output without adequate validation, enabling injection-style
      attacks.

  - id: LLM06:2025
    title: Excessive Agency
    description: >-
      An LLM-based agent is granted more functionality, permissions, or autonomy than its task
      requires.

  - id: LLM07:2025
    title: System Prompt Leakage
    description: >-
      Sensitive instructions or logic embedded in the system prompt are exposed to end users.

  - id: LLM08:2025
    title: Vector and Embedding Weaknesses
    description: >-
      Weaknesses in how vectors or embeddings are generated, stored, or retrieved (for example in
      RAG pipelines) are exploited.

  - id: LLM09:2025
    title: Misinformation
    description: >-
      The LLM produces false or misleading content presented as accurate, which users act on.

  - id: LLM10:2025
    title: Unbounded Consumption
    description: >-
      Uncontrolled resource or inference consumption leads to denial of service or excessive
      operating cost.
