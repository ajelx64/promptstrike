# 16 tactics and 173 techniques (103 parent + 70 sub-techniques). Sub-techniques carry `parent`.
# `tactics` lists the tactic ids a technique achieves; a technique may serve several.
#
# PATH NOTE for future refreshes: `dist/ATLAS.yaml` is DEPRECATED and no longer updated. The live
# distribution is `dist/v6/ATLAS-<version>.yaml`; `dist/v6/ATLAS-latest.yaml` is a pointer file.
