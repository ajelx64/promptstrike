[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptstrike"
version = "0.1.0"
description = "AI/LLM bug-bounty testing & reporting assistant (authorized security testing only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Intended Audience :: Developers",
    "Environment :: Console",
]
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# PDF rendering needs system GTK/Pango libs; the report engine soft-fails to HTML without it.
pdf = ["weasyprint>=60"]
# AI-assisted report drafting; drafting is fully mockable/offline without this installed.
draft = ["anthropic>=0.40"]
# Interactive triage/report workbench; the CLI is fully usable without it.
tui = ["textual>=0.80"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "textual>=0.80"]

[project.scripts]
promptstrike = "promptstrike.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promptstrike = [
    "probes/pack/*.yaml",
    # Every template, not just *.html. An earlier glob listed only *.html, which silently
    # dropped finding.md.j2 from the wheel - and Markdown is the DEFAULT report format, so a
    # `pip install` of this package had a broken default path while an editable install worked.
    "report/templates/report/*",
    # Vendored knowledge pack — public, citable reference data; must ship with the package.
    "knowledge/data/*.yaml",
]
